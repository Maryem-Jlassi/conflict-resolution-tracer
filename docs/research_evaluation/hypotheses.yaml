schema_version: "1.0"
preregistered: true
pilot_results_used_for_thresholds: false
confidence_level: 0.95
multiple_comparisons: Holm
questions:
  RQ1: {primary_metric: accuracy, direction: higher, baseline: recency_only}
  RQ2: {primary_metric: attack_success_rate, direction: lower, baseline: no_provenance}
  RQ3: {primary_metric: stale_selection_rate, direction: lower, baseline: no_decay}
  RQ4: {primary_metric: accuracy, direction: higher, baseline: fixed_trust}
  RQ5: {primary_metric: brier_score, direction: lower, baseline: naive_trust}
  RQ6: {primary_metric: macro_accuracy, direction: noninferior, margin: 0.05}
  RQ7: {primary_metric: balanced_accuracy, direction: higher, lower_ci_threshold: 0.90}
  RQ8: {primary_metric: median_latency_ratio, direction: lower, upper_ci_threshold: 2.0}
