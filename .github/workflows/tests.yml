name: tests
on: [push, pull_request]
jobs:
  ordinary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests -q -m "not real_ollama and not external_data and not external_dataset and not performance and not slow and not human_annotation and not frozen_final"
