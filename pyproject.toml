[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conflict-resolution-tracer"
version = "0.2.1"
description = "Deterministic multi-agent memory coherence middleware"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "python-dateutil>=2.8",
    "httpx>=0.24",
    "cryptography>=41.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[tool.setuptools.packages.find]
include = ["crt_core*", "crt_service*", "crt_client*", "research_evaluation*", "tests*"]
